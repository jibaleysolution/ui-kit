name: Publish

# Publishes to npm when a version tag is pushed:
#   npm version patch   # bumps package.json + creates the tag
#   git push --follow-tags
#
# Requires a repo secret NPM_TOKEN — a granular npm access token with
# "bypass 2FA" enabled and write access to the @jibaleysolution scope.
# Add it once:  gh secret set NPM_TOKEN   (paste the token when prompted)
#
# prepublishOnly (typecheck + test + build) runs automatically before publish,
# so a broken build never ships.

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
