name: Deploy playground

# Builds the component playground to a static site and publishes it to GitHub
# Pages so anyone can browse the kit at:
#   https://jibaleysolution.github.io/ui-kit/
#
# `configure-pages` with enablement:true turns Pages on automatically the first
# time. If that step ever fails on permissions, enable it once manually:
#   repo Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'theme.css'
      - 'playground/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:play
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-play
      - uses: actions/deploy-pages@v4
        id: deployment
